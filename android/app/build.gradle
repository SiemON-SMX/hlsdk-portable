import java.time.LocalDateTime
  import java.time.Month
  import java.time.temporal.ChronoUnit

  apply plugin: 'com.android.application'

  android {
      ndkVersion '26.1.10909125'
      namespace 'su.xash.half_payne'

      defaultConfig {
          applicationId 'su.xash.half_payne'
          versionName '1.0'
          versionCode getBuildNum()
          minSdkVersion 21
          targetSdk 36
          compileSdk 36
          ndk {
              abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
          }

          externalNativeBuild {
              cmake {
                  arguments '-DPOLLY=ON', '-DCMAKE_CXX_FLAGS=-Wno-register'
              }
          }
      }      

      externalNativeBuild {
          cmake {
              version '3.22.1'
              path file('../../CMakeLists.txt')
          }
      }

      compileOptions {
          sourceCompatibility JavaVersion.VERSION_1_8
          targetCompatibility JavaVersion.VERSION_1_8
      }

      buildTypes {
          debug {
              minifyEnabled false
              shrinkResources false
              debuggable true
              proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
          }
          release {
              minifyEnabled false
              shrinkResources false
              proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
          }
      }

      lint {
          abortOnError false
      }

      androidResources {
          noCompress += ''
      }

      packagingOptions {
          jniLibs {
              useLegacyPackaging = true
          }
      }
  }

  static def getBuildNum() {
      LocalDateTime now = LocalDateTime.now()
      LocalDateTime releaseDate = LocalDateTime.of(2023, Month.DECEMBER, 28, 0, 0, 0)
      int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
      int minuteOfDay = now.getHour() * 60 + now.getMinute()
      return qBuildNum * 10000 + minuteOfDay
  }
  